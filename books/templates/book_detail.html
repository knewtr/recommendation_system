{% extends 'base.html' %}
{% block content %}

<div class="container py-4">
    <div class="card shadow-lg border-0 rounded-3 overflow-hidden">
        <div class="card-header bg-secondary text-white py-3">
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="h4 mb-0">
                    <i class="bi bi-person-video3 me-2"></i>
                    {{ object.title }}
                </h2>
            </div>
        </div>

        <div class="col-md-8">
            <div class="list-group list-group-flush">
                <div class="list-group-item border-0 px-0 py-3">
                    <div class="ps-4">
                        <div class="bg-grey p-3 rounded mt-2">
                            {{ object.description|linebreaks|default:"Нет информации" }}
                        </div>
                    </div>
                </div>

                {% if user == object.owner %}
                <div class="d-flex justify-content-between align-items-center">
                    <div class="btn-group">
                        <div>
                            <a class="btn btn-outline-primary btn-sm me-2"
                           href="{% url 'books:book_update' book.pk %}"
                           role="button">Редактировать</a>
                        </div>
                        {% endif %}
                        <div>
                            <a class="btn btn-outline-primary btn-sm me-2"
                           href="{% url 'books:book_list' %}" role="button">Назад</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
